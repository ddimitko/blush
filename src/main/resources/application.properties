spring.application.name=beautyhub

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:beautyhub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# JPA Performance Configuration
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.cache.use_second_level_cache=false

# Timezone Configuration - Use UTC for all operations
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.time-zone=UTC
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss'Z'

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms
# JWT Configuration
app.jwt.secret=${JWT_SECRET:your-jwt-secret-key-change-in-production}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# OAuth2 Configuration - Facebook Login
# To enable Facebook OAuth2, set the environment variables:
# FACEBOOK_CLIENT_ID, FACEBOOK_CLIENT_SECRET
# Note: OAuth2 will only be enabled when both client-id and client-secret are provided

# Stripe Configuration
stripe.api.secret-key=${STRIPE_SECRET_KEY:}
stripe.api.publishable-key=${STRIPE_PUBLISHABLE_KEY:}
stripe.api.version=${STRIPE_API_VERSION:2025-05-28.basil}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}
stripe.connect.client-id=${STRIPE_CONNECT_CLIENT_ID:}
stripe.currency=${STRIPE_CURRENCY:eur}

# VAT & Tax Compliance Configuration
vat.validation.enabled=${VAT_VALIDATION_ENABLED:true}
vat.validation.api.url=${VAT_VALIDATION_API_URL:https://ec.europa.eu/taxation_customs/vies/services/checkVatService}
vat.validation.cache.ttl=${VAT_VALIDATION_CACHE_TTL:3600}
tax.default.rate.bulgaria=${TAX_DEFAULT_RATE_BULGARIA:0.20}
tax.stripe.integration.enabled=${TAX_STRIPE_INTEGRATION_ENABLED:true}

# Compliance Management Configuration
compliance.review.interval.months=${COMPLIANCE_REVIEW_INTERVAL_MONTHS:6}
compliance.audit.retention.years=${COMPLIANCE_AUDIT_RETENTION_YEARS:10}
compliance.health.check.enabled=${COMPLIANCE_HEALTH_CHECK_ENABLED:true}

# DAC7 Reporting Configuration
dac7.threshold.eur=${DAC7_THRESHOLD_EUR:2000}
dac7.reporting.enabled=${DAC7_REPORTING_ENABLED:true}
dac7.auto.generation.enabled=${DAC7_AUTO_GENERATION_ENABLED:false}

# Platform Information (for invoicing)
platform.name=${PLATFORM_NAME:Lunara}
platform.vat.number=${PLATFORM_VAT_NUMBER:BG123456789}
platform.address=${PLATFORM_ADDRESS:Sofia, Bulgaria}
platform.city=${PLATFORM_CITY:Sofia}
platform.postal.code=${PLATFORM_POSTAL_CODE:1000}
platform.country=${PLATFORM_COUNTRY:BG}

# Rate Limiting Configuration
rate.limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX_REQUESTS:5}
rate.limit.auth.window-minutes=${RATE_LIMIT_AUTH_WINDOW_MINUTES:15}
rate.limit.api.max-requests=${RATE_LIMIT_API_MAX_REQUESTS:100}
rate.limit.api.window-minutes=${RATE_LIMIT_API_WINDOW_MINUTES:1}
rate.limit.payment.max-requests=${RATE_LIMIT_PAYMENT_MAX_REQUESTS:3}
rate.limit.payment.window-minutes=${RATE_LIMIT_PAYMENT_WINDOW_MINUTES:5}

# Firebase Configuration
firebase.config.path=classpath:firebase-service-account.json

# Email Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}

# Email Settings - Production Ready
app.email.from=${EMAIL_FROM:noreply@lunara.com}
app.email.from-name=${EMAIL_FROM_NAME:Lunara}
# Use environment variable for production domain, fallback to current public IP for development
app.email.base-url=${EMAIL_BASE_URL:https://app.lunara.com}

# File Upload Configuration
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
spring.servlet.multipart.enabled=true

# File Upload Security
app.upload.allowed-types=image/jpeg,image/png,image/gif,image/webp
app.upload.max-files-per-user=50
app.upload.scan-for-viruses=${VIRUS_SCAN_ENABLED:false}

# HTTPS Configuration - Production Ready
# Use environment variables for production SSL configuration
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
# Use production certificate for production domains, localhost certificate for development
server.ssl.key-store=${SERVER_SSL_KEY_STORE:classpath:production.p12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:changeit}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:lunara-api}

# CORS Configuration - Production Ready with iOS App Support
# Use environment variable for production, fallback to development origins
# Include api.lunara.com for iOS app and other API clients
# Include iOS app origins for native mobile app support
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://app.lunara.com,https://api.lunara.com,https://localhost:3000,https://109.104.206.19:3000,app://com.lunara.app,app://com.lunara.LunaraApp,capacitor://localhost,ionic://localhost,https://109.104.206.19:8443}

# WebSocket Configuration - Production Ready with iOS App Support
# Must match CORS origins for consistency and security
websocket.enabled=true
websocket.stomp.enabled=false
app.websocket.allowed-origins=${WEBSOCKET_ALLOWED_ORIGINS:https://app.lunara.com,https://api.lunara.com,wss://localhost:3000,wss://109.104.206.19:3000,app://com.lunara.app,app://com.lunara.LunaraApp,wss://109.104.206.19:8443}

# Enhanced WebSocket Security
app.websocket.rate-limiting.enabled=true
app.websocket.rate-limiting.max-connections-per-ip=10
app.websocket.rate-limiting.max-connections-per-user=5
app.websocket.rate-limiting.max-subscriptions-per-session=50
app.websocket.rate-limiting.max-messages-per-minute=100

# WebSocket Heartbeat Configuration
app.websocket.heartbeat.enabled=true
app.websocket.heartbeat.interval=25000
app.websocket.heartbeat.timeout=60000

# WebSocket Message Configuration
app.websocket.message.max-size=65536
app.websocket.message.compression.enabled=true
app.websocket.message.acknowledgment.enabled=true

# RabbitMQ Configuration
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
#spring.messaging.stomp.relay.enabled=true

# RabbitMQ STOMP Configuration (for WebSocket STOMP Broker Relay)
spring.rabbitmq.stomp.host=localhost
spring.rabbitmq.stomp.port=61613
spring.rabbitmq.stomp.login=guest
spring.rabbitmq.stomp.passcode=guest

# WebSocket Configuration for monitoring and debugging
logging.level.org.springframework.messaging=INFO
logging.level.org.springframework.web.socket=INFO
logging.level.org.springframework.web.socket.sockjs=DEBUG

# WebSocket HTTPS Configuration
server.ssl.enabled-protocols=TLSv1.2,TLSv1.3
server.ssl.ciphers=TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256

# Disable debug mode for cleaner output
debug=false

# Actuator Configuration
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
management.endpoint.health.show-details=${HEALTH_DETAILS:when-authorized}
management.prometheus.metrics.export.enabled=${METRICS_PROMETHEUS_ENABLED:true}
management.endpoint.health.cache.time-to-live=10s
management.endpoint.metrics.cache.time-to-live=5s

# Performance Monitoring
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
management.metrics.distribution.slo.http.server.requests=50ms,100ms,200ms,500ms

# Application-specific monitoring
management.metrics.tags.application=lunara
management.metrics.tags.environment=${SPRING_PROFILES_ACTIVE:development}

# Cache Configuration
spring.cache.type=redis
spring.cache.redis.time-to-live=3600000
spring.cache.redis.cache-null-values=false

# Logging Configuration
logging.level.com.ddimitko.beautyhub=${LOG_LEVEL_APP:DEBUG}
logging.level.org.springframework.cache=${LOG_LEVEL_CACHE:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:INFO}
logging.file.name=${LOG_FILE_PATH:logs/lunara.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# Feature Flags
app.features.rate-limiting.enabled=${RATE_LIMITING_ENABLED:true}
app.features.caching.enabled=${CACHING_ENABLED:true}
app.features.monitoring.enabled=${MONITORING_ENABLED:true}
app.features.audit-logging.enabled=${AUDIT_LOGGING_ENABLED:true}
