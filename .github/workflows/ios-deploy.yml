name: iOS TestFlight Deployment

on:
  push:
    branches: [ ios-main ]
    paths:
      - 'LunaraApp/**'
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (leave empty for auto-increment)'
        required: false
        type: string
      release_notes:
        description: 'Release notes for TestFlight'
        required: false
        default: 'Bug fixes and improvements'
        type: string

env:
  XCODE_VERSION: '15.2'

jobs:
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-14
    environment: 
      name: testflight
      url: https://appstoreconnect.apple.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          LunaraApp/.build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('LunaraApp/Package.swift', 'LunaraApp/Package.resolved') }}

    - name: Install App Store Connect API Key
      env:
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      run: |
        mkdir -p ~/private_keys
        echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}.p8

    - name: Import certificates and provisioning profiles
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate and provisioning profile from secrets
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Apply provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

    - name: Increment build number
      working-directory: LunaraApp
      run: |
        if [ -n "${{ github.event.inputs.build_number }}" ]; then
          BUILD_NUMBER="${{ github.event.inputs.build_number }}"
        else
          # Auto-increment based on git commits
          BUILD_NUMBER=$(git rev-list --count HEAD)
        fi
        
        echo "Setting build number to: $BUILD_NUMBER"
        
        # Update Info.plist with new build number
        /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" LunaraApp/Info.plist
        
        # Also update project.pbxproj if needed
        sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $BUILD_NUMBER/g" LunaraApp.xcodeproj/project.pbxproj
        
        echo "BUILD_NUMBER=$BUILD_NUMBER" >> $GITHUB_ENV

    - name: Build and archive
      working-directory: LunaraApp
      run: |
        xcodebuild archive \
          -scheme LunaraApp \
          -configuration Release \
          -destination generic/platform=iOS \
          -archivePath $RUNNER_TEMP/LunaraApp.xcarchive \
          -allowProvisioningUpdates \
          DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM_ID }}

    - name: Export for App Store
      working-directory: LunaraApp
      run: |
        # Create export options plist
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF

        # Export archive to IPA
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/LunaraApp.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath $RUNNER_TEMP/export

    - name: Upload to TestFlight
      working-directory: LunaraApp
      run: |
        # Find the IPA file
        IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" | head -1)
        
        if [ -z "$IPA_PATH" ]; then
          echo "Error: No IPA file found"
          exit 1
        fi
        
        echo "Uploading IPA: $IPA_PATH"
        
        # Upload to App Store Connect
        xcrun altool --upload-app \
          --type ios \
          --file "$IPA_PATH" \
          --apiKey ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }} \
          --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
          --verbose

    - name: Add TestFlight release notes
      if: success()
      run: |
        RELEASE_NOTES="${{ github.event.inputs.release_notes || 'Bug fixes and improvements' }}"
        
        # Note: This requires additional setup with App Store Connect API
        # For now, we'll just output the release notes
        echo "Release Notes for Build ${{ env.BUILD_NUMBER }}:"
        echo "$RELEASE_NOTES"
        
        # TODO: Implement automatic release notes update via App Store Connect API
        # This would require additional API calls to update the build metadata

    - name: Create GitHub release
      if: success()
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ios-v${{ env.BUILD_NUMBER }}
        release_name: iOS Release v${{ env.BUILD_NUMBER }}
        body: |
          🚀 **iOS App Release v${{ env.BUILD_NUMBER }}**
          
          **Release Notes:**
          ${{ github.event.inputs.release_notes || 'Bug fixes and improvements' }}
          
          **Build Information:**
          - Build Number: ${{ env.BUILD_NUMBER }}
          - Xcode Version: ${{ env.XCODE_VERSION }}
          - Deployment: TestFlight
          
          **Changes in this release:**
          ${{ github.event.head_commit.message }}
        draft: false
        prerelease: false

    - name: Upload IPA artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-testflight-${{ env.BUILD_NUMBER }}
        path: ${{ runner.temp }}/export/*.ipa
        retention-days: 90

    - name: Clean up keychain
      if: always()
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

    - name: Notify deployment status
      if: always()
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#ios-releases'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        fields: repo,message,commit,author,action,eventName,ref,workflow
        custom_payload: |
          {
            "text": "iOS TestFlight Deployment",
            "attachments": [{
              "color": "${{ job.status == 'success' && 'good' || 'danger' }}",
              "fields": [{
                "title": "Build Number",
                "value": "${{ env.BUILD_NUMBER }}",
                "short": true
              }, {
                "title": "Status",
                "value": "${{ job.status }}",
                "short": true
              }]
            }]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
