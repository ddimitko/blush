name: iOS CI/CD Pipeline

on:
  push:
    branches: [ ios-develop, ios-main ]
    paths:
      - 'LunaraApp/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    branches: [ ios-develop, ios-main ]
    paths:
      - 'LunaraApp/**'

env:
  XCODE_VERSION: '15.2'
  IOS_SIMULATOR: 'iPhone 15 Pro'
  IOS_VERSION: '17.2'

jobs:
  # iOS Testing and Building
  ios-test:
    name: iOS Tests
    runs-on: macos-14
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Show Xcode version
      run: xcodebuild -version

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          LunaraApp/.build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('LunaraApp/Package.swift', 'LunaraApp/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-

    - name: Resolve Swift Package dependencies
      working-directory: LunaraApp
      run: xcodebuild -resolvePackageDependencies -scheme LunaraApp

    - name: Run SwiftLint
      working-directory: LunaraApp
      run: |
        if which swiftlint >/dev/null; then
          swiftlint --strict
        else
          echo "SwiftLint not installed, skipping..."
        fi

    - name: Build for testing
      working-directory: LunaraApp
      run: |
        xcodebuild clean build-for-testing \
          -scheme LunaraApp \
          -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
          -derivedDataPath DerivedData \
          CODE_SIGNING_ALLOWED=NO

    - name: Run unit tests
      working-directory: LunaraApp
      run: |
        xcodebuild test-without-building \
          -scheme LunaraApp \
          -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
          -derivedDataPath DerivedData \
          -resultBundlePath TestResults.xcresult \
          CODE_SIGNING_ALLOWED=NO

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ios-test-results
        path: LunaraApp/TestResults.xcresult

    - name: Parse test results
      if: always()
      run: |
        cd LunaraApp
        xcrun xcresulttool get --format json --path TestResults.xcresult > test_results.json
        echo "Test results saved to test_results.json"

  # Build for different environments
  ios-build:
    name: iOS Build
    runs-on: macos-14
    needs: ios-test
    if: github.ref == 'refs/heads/ios-develop' || github.ref == 'refs/heads/ios-main'
    
    strategy:
      matrix:
        configuration: [Debug, Release]
        
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode version
      run: sudo xcode-select -s /Applications/Xcode_${{ env.XCODE_VERSION }}.app/Contents/Developer

    - name: Cache Swift Package Manager
      uses: actions/cache@v4
      with:
        path: |
          LunaraApp/.build
          ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-spm-${{ hashFiles('LunaraApp/Package.swift', 'LunaraApp/Package.resolved') }}

    - name: Import certificates and provisioning profiles
      if: matrix.configuration == 'Release'
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate and provisioning profile from secrets
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Apply provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles

    - name: Build iOS app
      working-directory: LunaraApp
      run: |
        if [ "${{ matrix.configuration }}" == "Release" ]; then
          # Build for App Store
          xcodebuild archive \
            -scheme LunaraApp \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath $RUNNER_TEMP/LunaraApp.xcarchive \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM=${{ secrets.DEVELOPMENT_TEAM_ID }}
        else
          # Build for simulator (Debug)
          xcodebuild build \
            -scheme LunaraApp \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=${{ env.IOS_SIMULATOR }},OS=${{ env.IOS_VERSION }}" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
        fi

    - name: Export IPA
      if: matrix.configuration == 'Release'
      working-directory: LunaraApp
      run: |
        # Create export options plist
        cat > ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${{ secrets.DEVELOPMENT_TEAM_ID }}</string>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>compileBitcode</key>
            <false/>
        </dict>
        </plist>
        EOF

        # Export archive to IPA
        xcodebuild -exportArchive \
          -archivePath $RUNNER_TEMP/LunaraApp.xcarchive \
          -exportOptionsPlist ExportOptions.plist \
          -exportPath $RUNNER_TEMP/export

    - name: Upload IPA artifact
      if: matrix.configuration == 'Release'
      uses: actions/upload-artifact@v4
      with:
        name: ios-app-release
        path: ${{ runner.temp }}/export/*.ipa
        retention-days: 30

    - name: Clean up keychain
      if: always() && matrix.configuration == 'Release'
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
