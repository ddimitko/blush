plugins {
    id 'groovy'
    id 'org.springframework.boot' version '3.5.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
}

group = 'com.ddimitko'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21) // Use LTS version compatible with tooling
    }
}

// Enable parameter names for reflection
tasks.withType(org.gradle.api.tasks.compile.GroovyCompile) {
    options.compilerArgs += ['-parameters']
    groovyOptions.configurationScript = null
}

tasks.withType(JavaCompile) {
    options.compilerArgs += ['-parameters']
    options.encoding = 'UTF-8'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // Exclude commons-logging to prevent conflicts with Spring's logging bridge
    all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.apache.groovy:groovy'

    // Cache support
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.ehcache:ehcache:3.10.8'

    // JWT Support
    implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-impl:0.12.3'
    implementation 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // Stripe Integration
    implementation 'com.stripe:stripe-java:29.2.0'

    // Email Support
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'

    // Actuator for health checks and metrics
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'

    // Environment variable loading from .env files
    implementation 'io.github.cdimascio:dotenv-java:3.0.0'

    // Jackson for JSON processing
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-hibernate6'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
    annotationProcessor 'org.projectlombok:lombok'

    // --- Testing ---
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.apache.groovy:groovy-json'

    // Testcontainers for PostgreSQL (use Docker to provision DB during tests)
    testImplementation platform('org.testcontainers:testcontainers-bom:1.20.1')
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'

    // Optional: if we later need Redis container

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Configure compiler to preserve parameter names for Spring
compileGroovy {
    options.compilerArgs += ['-parameters']
    options.encoding = 'UTF-8'
    groovyOptions.configurationScript = null
}

compileTestGroovy {
    options.compilerArgs += ['-parameters']
    options.encoding = 'UTF-8'
    groovyOptions.configurationScript = null
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    // 0.8.11 does not fully support JDK 22/23/24 classes; pin to 0.8.12 which supports up to class file 67.
    // Since we run tests on JDK 21, 0.8.12 is safe and fixes instrumentation issues on newer JDKs installed locally.
    toolVersion = "0.8.12"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    // Align class directories and excludes with verification task without afterEvaluate
    def excludes = ['**/config/**','**/dto/**','**/entity/**','**/*Application*','**/*Config*']
    classDirectories.setFrom(files(
        fileTree(dir: "$buildDir/classes/java/main", exclude: excludes),
        fileTree(dir: "$buildDir/classes/groovy/main", exclude: excludes)
    ))
    finalizedBy jacocoTestCoverageVerification
}

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                minimum = 0.10  // Step 1: raise to 10% now that Auth integration test is added. Next step: 30%+.
            }
        }
    }

    // Ensure we include both Java and Groovy compiled outputs
    def excludes = ['**/config/**','**/dto/**','**/entity/**','**/*Application*','**/*Config*']
    classDirectories.setFrom(files(
        fileTree(dir: "$buildDir/classes/java/main", exclude: excludes),
        fileTree(dir: "$buildDir/classes/groovy/main", exclude: excludes)
    ))
}
