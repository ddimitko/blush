  evaluation_interval: 15s
  external_labels:
    monitor: 'lunara-monitor'
    environment: 'production'

rule_files:
  - "alert_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot Backend
  - job_name: 'lunara-backend'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8443']
    scrape_interval: 15s
    scrape_timeout: 10s
    scheme: https
    tls_config:
      insecure_skip_verify: true
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'lunara_.*'
        target_label: 'service'
        replacement: 'lunara-backend'

  # Note: Additional exporters can be added here for production monitoring
  # Examples: postgres_exporter, redis_exporter, node_exporter, cadvisor

alerting:
  alertmanagers:
    - static_configs:
        - targets:
